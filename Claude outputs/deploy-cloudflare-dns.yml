name: deploy cloudflare dns via OpenTofu

on:
  pull_request:
    paths: ["iac/cloudflare/**"]
  push:
    branches: [main]
    paths: ["iac/cloudflare/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-dns-iac
  cancel-in-progress: false # never cancel an in-flight apply

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/cloudflare
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: Check formatting
        run: tofu fmt -check

      - name: Initialize backend
        run: tofu init

      - name: Validate configuration
        run: tofu validate

      - name: Plan changes
        run: tofu plan -no-color

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # requires a manual approver -- DNS changes are high blast-radius
    defaults:
      run:
        working-directory: iac/cloudflare
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: Initialize backend
        run: tofu init

      - name: Apply changes
        run: tofu apply -auto-approve -no-color
