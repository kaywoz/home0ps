# Lints every active compose stack with compose-lint and the .compose-lint.yml beside it
# (.claude/rules/compose.md, "Lint gate"). Read-only: no secrets, no deploy, no SARIF upload.
# homenas stacks are linted with their committed .env.example so ${VAR} mounts are graded
# (placeholder paths, never real values).
name: lint compose

on:
  pull_request:
    paths:
      - "docker-compose/**"
      - ".github/compose-lint/**"
      - ".github/workflows/lint-compose.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose/**"
      - ".github/compose-lint/**"
      - ".github/workflows/lint-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install compose-lint (hash-locked)
        run: pip install --require-hashes --no-deps -r .github/compose-lint/requirements.txt

      - name: No named volumes (bind mounts only, .claude/rules/compose.md)
        run: python .github/compose-lint/no-named-volumes.py docker-compose/*/compose.yaml docker-compose/homenas/*/compose.yaml

      - name: Placeholder .env for homenas stacks
        run: |
          set -euo pipefail
          for d in docker-compose/homenas/*/; do
            if [ -f "${d}.env.example" ]; then cp "${d}.env.example" "${d}.env"; fi
          done

      - name: Lint
        run: |
          set -euo pipefail
          rc=0
          for f in docker-compose/*/compose.yaml docker-compose/homenas/*/compose.yaml; do
            compose-lint check --strict-config --fail-on high "$f" || rc=1
          done
          exit "$rc"
