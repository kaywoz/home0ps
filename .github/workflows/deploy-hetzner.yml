name: deploy hetzner via OpenTofu

on:
  pull_request:
    paths: ["iac/hetzner/**", ".github/workflows/deploy-hetzner.yml"]
  push:
    branches: [main]
    paths: ["iac/hetzner/**", ".github/workflows/deploy-hetzner.yml"]
  workflow_dispatch:
    inputs:
      replace:
        description: "Resource address to rebuild (tofu apply -replace), e.g. hcloud_server.honeypot. Empty = normal apply."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hetzner-iac
  cancel-in-progress: false # never cancel an in-flight apply

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
  TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
  TF_VAR_tpot_ssh_public_key: ${{ secrets.TPOT_SSH_PUBLIC_KEY }}
  TF_VAR_admin_ipv4: ${{ secrets.HOME_PUBLIC_IPV4 }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/hetzner
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: Check formatting
        run: tofu fmt -check

      - name: Initialize backend
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: tofu init -backend-config="endpoint=$S3_ENDPOINT" -backend-config="bucket=$S3_BUCKET"

      - name: Validate configuration
        run: tofu validate

      - name: Plan changes
        run: tofu plan -no-color

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/hetzner
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: Initialize backend
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: tofu init -backend-config="endpoint=$S3_ENDPOINT" -backend-config="bucket=$S3_BUCKET"

      - name: Apply changes
        env:
          REPLACE: ${{ inputs.replace }} # passed via env, never interpolated into the script
        run: |
          if [ -z "$REPLACE" ]; then
            tofu apply -auto-approve -no-color
          elif [[ "$REPLACE" =~ ^hcloud_[a-z_]+\.[a-z0-9_]+$ ]]; then
            echo "Rebuilding: $REPLACE"
            tofu apply -auto-approve -no-color -replace="$REPLACE"
          else
            echo "replace must look like hcloud_<type>.<name>" >&2
            exit 1
          fi
