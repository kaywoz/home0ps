# PROPOSAL — not deployed. Storage stack on the replacement storage host (MOS): the host's own storage
# services. Design, open questions and migration: docker-compose/storage/README.md. Nothing here runs until
# kaywoz OKs it.
#
# Zone: the storage host's own network (no zone VLAN). Unlike the other three stacks, these are served by the
# host's own tailscaled (tag:storage, which already has svc:kopia, svc:rustfs and svc:scrutiny), so they use
# today's pattern: one bridge per app, ports on 127.0.0.1, `tailscale serve` on the host.
# - socketproxy, proxy-scrutiny, proxy-kopia, proxy-rustfs: plain bridges (not internal, because internal networks can't publish ports).
#   They need no egress. A container on a plain bridge can reach the MOS host through the bridge gateway, so
#   the host firewall (#219) and the rclone rc fix (#316) come first (README S-Q1).
# - Time Machine: macvlan on the host's own interface with a fixed address, so Macs reach SMB without
#   clashing with MOS's own Samba on 445 (README S-Q2).
# No userns-remap assumed on MOS (#310 §7c open): `user:` uids are host uids.
#
# Observability for the whole box lives here (observed-hosts.md: compose hosts keep the socket proxy and the
# Beszel agent in their compose). One Docker daemon serves all four stacks, so one proxy and one agent cover
# every container. Both keep the names they have as MOS-template deploys today. Dozzle on the monitoring host
# reads this host in remote-host mode through the proxy: no Dozzle agent (an agent needs the full socket).
services:
  # Read-only Docker API for Dozzle (monitoring host) and the Beszel agent. Never host networking: the proxy
  # would listen on every interface. `tailscale serve --tcp=2375 tcp://127.0.0.1:2375` on the host;
  # only tag:monitoring may reach it (existing grant + tests).
  socketproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: kr-ccp-socketproxy-0301
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 64m
    environment:
      - CONTAINERS=1   # list/inspect/logs/stats
      - INFO=1
      - EVENTS=1
      - POST=0         # read-only API
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # :ro restricts nothing; POST=0 does
    networks:
      - socketproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Beszel agent: host network (upstream requirement for interface stats), LISTEN on the tailnet IP only,
  # Docker only through the read-only proxy, pushes to svc:beszel. As deployed today (containers.md).
  beszelagent:
    image: henrygd/beszel-agent:latest
    container_name: kr-ccp-beszelagent-0201
    restart: unless-stopped
    network_mode: host
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 128m
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
      LISTEN: ${BESZEL_LISTEN}         # <tailnet-ip>:45876
      HUB_URL: https://beszel.${TAILNET}.ts.net
      KEY_FILE: /run/secrets/beszel_key      # KEY_FILE / TOKEN_FILE supported by the agent
      TOKEN_FILE: /run/secrets/beszel_token
    secrets:
      - beszel_key
      - beszel_token
    volumes:
      - ${APPDATA}/beszel/agent:/var/lib/beszel-agent   # owned 65534
    healthcheck:                       # upstream's suggestion: fails if the health file is older than 91 s
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Kopia repository server: backups from the other machines (#43). Repository on the pool. TLS with its own
  # certificate (the repository server's gRPC needs TLS); served as svc:kopia with https+insecure.
  kopia:
    image: kopia/kopia:latest
    container_name: kr-ccp-kopia-0101
    restart: unless-stopped
    user: "2301:2301"                  # no USER and no entrypoint script in the image (to verify at build)
    read_only: true                    # not documented upstream; to verify at build
    cap_drop: [ALL]                    # no FUSE/SYS_ADMIN: those are only for `kopia mount`
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m
    pids_limit: 300
    mem_limit: 2g
    environment:
      KOPIA_CONFIG_PATH: /app/config/repository.config
      KOPIA_PERSIST_CREDENTIALS_ON_CONNECT: "true"   # repository password in /app/config/*.kopia-password
                                                     # (600) instead of KOPIA_PASSWORD in env
    # UI basic auth from an htpasswd file (a hidden, older flag; `kopia server user add` covers repository
    # users). No password on the command line or in env: both are readable through the socket proxy.
    command:
      - server
      - start
      - --address=0.0.0.0:51515
      - --tls-cert-file=/app/config/tls.crt
      - --tls-key-file=/app/config/tls.key
      - --htpasswd-file=/app/config/htpasswd
    ports:
      - "127.0.0.1:51515:51515"        # tailscale serve --service=svc:kopia https+insecure://127.0.0.1:51515
    volumes:
      - ${APPDATA}/kopia/config:/app/config
      - ${APPDATA}/kopia/cache:/app/cache
      - ${APPDATA}/kopia/logs:/app/logs
      - ${BACKUPS}:/repository
    networks:
      - proxy-kopia
    healthcheck:                       # no unauthenticated endpoint: a 401 from the UI means it's up
      test: ["CMD-SHELL", "curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:51515/ | grep -q 401"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Time Machine for the Macs. The one service here that needs root: its entrypoint creates the SMB user,
  # writes smb.conf and the avahi service, then runs smbd/nmbd/avahi under s6. Not read_only.
  timemachine:
    image: mbentley/timemachine:smb
    container_name: kr-ccp-timemachine-0101
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:                           # from the entrypoint; each to be confirmed one at a time at build
      - CHOWN                          # user setup, chown of the share
      - DAC_OVERRIDE
      - FOWNER
      - SETUID                         # smbd switches to the share user per connection
      - SETGID
      - NET_BIND_SERVICE               # 445
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/samba                     # as in upstream's compose
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 200
    mem_limit: 512m
    environment:
      TM_USERNAME: timemachine
      TM_GROUPNAME: timemachine
      TM_UID: "2303"                   # owner of the share files (not the process uid)
      TM_GID: "2303"
      PASSWORD_FILE: /run/secrets/timemachine_password
      VOLUME_SIZE_LIMIT: 1T            # caps what Time Machine sees as free space
      SET_PERMISSIONS: "false"
    secrets:
      - timemachine_password
    volumes:
      - ${TIMEMACHINE}:/opt/timemachine
    networks:
      storage-lan:
        ipv4_address: ${TIMEMACHINE_IP}
    healthcheck:                       # the image ships none for the smb variant
      test: ["CMD", "pgrep", "smbd"]
      interval: 60s
      timeout: 5s
      retries: 3

  # RustFS: local S3 (#39). Keys as files (*_FILE are native); never the default rustfsadmin/rustfsadmin.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: kr-ccp-rustfs-0101
    restart: unless-stopped
    user: "2302:2302"                  # image runs as 10001; the entrypoint never switches user
    read_only: true                    # not documented upstream; to verify at build
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    pids_limit: 300
    mem_limit: 2g
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: ${RUSTFS_CONSOLE_ORIGIN}   # the image defaults to "*"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    ports:
      - "127.0.0.1:9000:9000"          # S3 API: a Service of its own (README S-Q3)
      - "127.0.0.1:9001:9001"          # console: svc:rustfs
    volumes:
      - ${S3DATA}:/data
      - ${APPDATA}/rustfs/logs:/logs
    networks:
      - proxy-rustfs
    healthcheck:                       # as in upstream's compose
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Scrutiny (omnibus, as the MOS template): SMART health of the box's four NVMe drives (#103), served as
  # svc:scrutiny. Runs as root with SYS_RAWIO + SYS_ADMIN (upstream's requirement for NVMe); its own docs warn
  # that SYS_ADMIN allows host compromise (README S-Q4). The web UI and API have no authentication.
  scrutiny:
    image: ghcr.io/analogj/scrutiny:latest-omnibus
    container_name: kr-ccp-scrutiny-0101
    restart: unless-stopped
    # Not read_only, not non-root: s6-overlay runs influxd, the web app and cron as root and writes /etc.
    cap_drop: [ALL]
    cap_add:
      - SYS_RAWIO                      # SMART passthrough
      - SYS_ADMIN                      # NVMe admin commands
      - CHOWN                          # s6 init (to confirm at build)
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/nvme0:/dev/nvme0
      - /dev/nvme1:/dev/nvme1
      - /dev/nvme2:/dev/nvme2
      - /dev/nvme3:/dev/nvme3
    pids_limit: 200
    mem_limit: 1g
    ports:
      - "127.0.0.1:8080:8080"          # svc:scrutiny via tailscale serve; InfluxDB (8086) stays unpublished
    volumes:
      - /run/udev:/run/udev:ro
      - ${APPDATA}/scrutiny/config:/opt/scrutiny/config
      - ${APPDATA}/scrutiny/influxdb:/opt/scrutiny/influxdb
    networks:
      - proxy-scrutiny
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  socketproxy:
    name: socketproxy
    driver: bridge
  proxy-scrutiny:
    name: proxy-scrutiny
    driver: bridge
  proxy-kopia:
    name: proxy-kopia
    driver: bridge
  proxy-rustfs:
    name: proxy-rustfs
    driver: bridge
  storage-lan:
    name: storage-lan
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT}
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}
          ip_range: ${LAN_RANGE}

secrets:
  timemachine_password:
    file: ${APPDATA}/timemachine/password     # 600, root-owned (the entrypoint reads it as root)
  rustfs_access_key:
    file: ${APPDATA}/rustfs/secrets/access_key   # 600, owned 2302
  rustfs_secret_key:
    file: ${APPDATA}/rustfs/secrets/secret_key   # 600, owned 2302
  beszel_key:
    file: ${APPDATA}/beszel/secrets/key          # from the hub's "Add system"; 600, owned 65534
  beszel_token:
    file: ${APPDATA}/beszel/secrets/token        # 600, owned 65534
