# PROPOSAL — not deployed. Infra stack on the replacement storage host (MOS), replacing the infra VM.
# Design, open questions and migration: docker-compose/storage/README.md. Nothing here runs until kaywoz OKs it.
#
# Zone: VLAN 24 (infra, tier 0). Holds the Cloudflare Tunnel only.
# Dockhand-home is NOT here: in the #314 scenario the MOS UI is the storage host's Docker UI and nothing
# else on home is left for Dockhand to manage (open question in the README).
# - infra-vlan24: macvlan on the VLAN 24 sub-interface, no host IP on it: cloudflared's egress.
#   The MOS host can't reach macvlan containers, and they can't reach it.
# No Tailscale sidecar: nothing here has a UI.
# No userns-remap assumed on MOS (#310 §7c open): `user:` uids are host uids.
services:
  # cloudflared: the Cloudflare Tunnel for user-facing apps (second access plane, CLAUDE.md §8). Outbound
  # only. Token as a file. Ingress rules are kept in Cloudflare (remotely managed tunnel).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kr-ccp-cloudflared-0101
    restart: unless-stopped
    user: "2201:2201"                  # image is distroless nonroot, no entrypoint script: any uid works
    read_only: true                    # no writable path documented; to verify at build
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    # Metrics pinned to loopback: container builds otherwise bind 0.0.0.0:20241, which on macvlan
    # would be open to VLAN 24.
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cf_tunnel_token   # cloudflared >= 2025.4.0; never TUNNEL_TOKEN
    secrets:
      - cf_tunnel_token
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - infra-vlan24                   # how it reaches apps in other zones: README I-Q2

networks:
  infra-vlan24:
    name: infra-vlan24
    driver: macvlan
    driver_opts:
      parent: ${VLAN24_PARENT}
    ipam:
      config:
        - subnet: ${VLAN24_SUBNET}
          gateway: ${VLAN24_GATEWAY}
          ip_range: ${VLAN24_RANGE}

secrets:
  cf_tunnel_token:
    file: ${APPDATA}/cloudflared/token         # from the Cloudflare dashboard; 600, owned 2201
