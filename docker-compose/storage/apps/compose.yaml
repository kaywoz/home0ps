# PROPOSAL — not deployed. Apps stack on the replacement storage host (MOS), replacing the apps VM.
# Design, open questions and migration: docker-compose/storage/README.md. Nothing here runs until kaywoz OKs it.
#
# Zone: VLAN 31 (apps). Trusted, well-known apps only (CLAUDE.md §8).
# - apps-vlan31: macvlan on the VLAN 31 sub-interface, no host IP on it: egress for the containers that
#   need it (mediasort, the sidecar). The MOS host can't reach macvlan containers, and they can't reach it.
# - proxy-<app>: internal bridges for everything that needs no egress (paperless + its Redis,
#   FileBrowser Quantum, Immich's database and Redis). No published ports; the sidecar joins the ones it serves.
# - No `ports:` anywhere: Tailscale Services (and the mover's tcp:8089) are served by this stack's own
#   Tailscale sidecar (tag:docker, as the apps VM is today).
# No userns-remap assumed on MOS (#310 §7c open): `user:` uids are host uids, data folders owned by them.
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: kr-ccp-tailscale-0201
    hostname: ${TS_HOSTNAME}
    restart: unless-stopped
    user: "2110:2110"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    pids_limit: 100
    mem_limit: 256m
    environment:
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /tmp/tailscaled.sock      # set explicitly: docs and source disagree on the default
      TS_AUTHKEY: file:/run/secrets/ts_authkey
      TS_EXTRA_ARGS: --advertise-tags=tag:docker
      TS_SERVE_CONFIG: /config/serve.json   # svc:paperless, filebrowser, immich, archivebox, archivewarrior, atuin, dillinger, filestash, rackpeek; tcp:8089 -> mediasort (the mover)
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    secrets:
      - ts_authkey
    volumes:
      - ${APPDATA}/tailscale-apps/state:/var/lib/tailscale
      - ${APPDATA}/tailscale-apps/serve.json:/config/serve.json:ro
    networks:
      - apps-vlan31
      - proxy-paperless
      - proxy-filebrowser
      - proxy-immich
      - proxy-atuin
      - proxy-dillinger
      - proxy-filestash
      - proxy-rackpeek
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Media classifier (#260), moved from the apps VM unchanged. Egress to TMDB and the LLM provider, so it
  # sits on apps-vlan31. Its API (8089) is bearer-token protected and is now also reachable from VLAN 31.
  mediasort:
    build: ../../apps/mediasort        # built on the host from the repo checkout (open question: prebuilt image)
    image: home0ps/mediasort:latest
    container_name: kr-ccp-mediasort-0201
    restart: unless-stopped
    user: "2104:2104"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 64
    mem_limit: 256m
    environment:
      LLM_PROVIDER: anthropic           # openai | anthropic (no local LLM in this stack: Ollama dropped)
      OPENAI_MODEL: gpt-6-luna
      OPENAI_MIN_INTERVAL: "6.5"
      ANTHROPIC_MODEL: claude-haiku-5-5
      ANTHROPIC_MIN_INTERVAL: "1"
      LLM_KEY_FILE: /run/secrets/llm_key
      TOKEN_FILE: /run/secrets/mediasort_token
      TMDB_TOKEN_FILE: /run/secrets/tmdb_token
    secrets:
      - mediasort_token
      - tmdb_token
      - llm_key
    networks:
      - apps-vlan31
    # healthcheck: in the image (GET /health)

  # paperless-ngx: scan, OCR and archive documents. SQLite + Redis (no Postgres); no Tika/Gotenberg
  # (Office files and mail parsing parked). No egress.
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: kr-ccp-paperless-0101
    restart: unless-stopped
    user: "2105:2105"                  # "rootless" mode (docs/setup.md): s6 skips usermod/chown. Never with USERMAP_UID
    read_only: true                    # via S6_READ_ONLY_ROOT; read_only + rootless together untested upstream
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:size=32m                  # s6 copies its scripts here; also holds the *_FILE env
      - /tmp:size=1g                   # PAPERLESS_SCRATCH_DIR (OCR working files)
      - /var/cache/fontconfig:size=16m
    pids_limit: 300
    mem_limit: 2g
    environment:
      S6_READ_ONLY_ROOT: "1"
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/paperless_secret_key
      PAPERLESS_REDIS_FILE: /run/secrets/paperless_redis_url   # redis://:<password>@paperlessredis:6379
      PAPERLESS_OCR_LANGUAGE: eng      # extra languages can't be installed at start in rootless mode
      PAPERLESS_TIKA_ENABLED: "false"
    secrets:
      - paperless_secret_key
      - paperless_redis_url
    volumes:
      - ${APPDATA}/paperless/data:/usr/src/paperless/data      # SQLite db, index
      - ${APPDATA}/paperless/media:/usr/src/paperless/media    # the documents
      - ${APPDATA}/paperless/consume:/usr/src/paperless/consume
      - ${APPDATA}/paperless/export:/usr/src/paperless/export
    networks:
      - proxy-paperless                # internal: paperless + sidecar; no egress (no mail fetch)
      - paperless-backend              # internal: paperless + Redis
    depends_on:
      - paperlessredis
    # healthcheck: built into the image (curl http://localhost:8000)

  paperlessredis:
    image: redis:latest
    container_name: kr-ccp-paperlessredis-0101
    restart: unless-stopped
    user: "2106:2106"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Password (requirepass) from a config file: Redis has no *_FILE support. Only paperless shares its
    # network; the password is defence in depth.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    pids_limit: 64
    mem_limit: 256m
    volumes:
      - ${APPDATA}/paperless/redis:/data
      - ${APPDATA}/paperless/secrets/redis.conf:/usr/local/etc/redis/redis.conf:ro   # requirepass <pw>; save 60 1
    networks:
      - paperless-backend
    healthcheck:                       # reads the password from the file at run time: never in env or inspect
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(sed -n 's/^requirepass //p' /usr/local/etc/redis/redis.conf)\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3

  # FileBrowser Quantum: files through a browser. Secrets have no *_FILE support, so the admin password and
  # any OIDC secret live in config.yaml in the data folder (600, owned 2107), not in env.
  filebrowser:
    image: gtstef/filebrowser:latest
    container_name: kr-ccp-filebrowser-0101
    restart: unless-stopped
    user: "2107:2107"                  # image runs as uid 1000 with no entrypoint script: any uid works
    read_only: true                    # not documented upstream; to verify at build
    cap_drop: [ALL]                    # config.yaml sets http.port 8080, so no NET_BIND_SERVICE for port 80
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
      - /home/filebrowser/tmp:size=1g,uid=2107,gid=2107   # server.cacheDir (default "tmp"); must be fast
    pids_limit: 200
    mem_limit: 1g
    environment:
      FILEBROWSER_CONFIG: /home/filebrowser/data/config.yaml
    volumes:
      - ${APPDATA}/filebrowser/data:/home/filebrowser/data   # config.yaml, database.sqlite
      - ${SHARES}:/folder                                    # what it serves (source path in config.yaml)
    networks:
      - proxy-filebrowser              # internal: no egress
    healthcheck:                       # the image's own check is hard-coded to port 80
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Immich: photos. Four containers as in the upstream release compose. Server and ML use the moving
  # `release` tag (Immich publishes no `latest`). No egress for the server; the sidecar sees only the server.
  immich:
    image: ghcr.io/immich-app/immich-server:release
    container_name: kr-ccp-immich-0101
    restart: unless-stopped
    user: "2111:2111"                  # start.sh does no user switching (FAQ: non-root via user:)
    group_add:
      - ${RENDER_GID}                  # Quick Sync transcoding
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    read_only: true                    # not documented upstream; to verify at build
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=1g
    pids_limit: 500
    mem_limit: 4g
    environment:
      DB_HOSTNAME: immichdb
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD_FILE: /run/secrets/immich_db_password   # start.sh exports it into the process env
      REDIS_HOSTNAME: immichredis
      REDIS_PASSWORD_FILE: /run/secrets/immich_redis_password
      IMMICH_MACHINE_LEARNING_URL: http://immichml:3003
    secrets:
      - immich_db_password
      - immich_redis_password
    volumes:
      - ${PHOTOS}:/data                # UPLOAD_LOCATION: originals, thumbs, encoded video; owned 2111
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy-immich                   # internal: server + sidecar
      - immich-backend                 # internal: server + db + redis + ML
    depends_on:
      - immichdb
      - immichredis
    # healthcheck: built into the image (immich-healthcheck)

  # Machine learning (search, faces). CPU by default; the OpenVINO variant (`release-openvino` + /dev/dri)
  # is an option on the N95 (README A-Q4). Models download on first use: needs egress then (README).
  immichml:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: kr-ccp-immichml-0101
    restart: unless-stopped
    user: "2112:2112"
    read_only: true                    # not documented upstream; to verify at build
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m
    pids_limit: 300
    mem_limit: 4g
    volumes:
      - ${APPDATA}/immich/model-cache:/cache   # HF_HOME + JIT caches; bind mount (named volumes break non-root)
    networks:
      - immich-backend                 # internal: its API (3003) has no auth
    # healthcheck: built into the image (healthcheck.py)

  # Database: Immich's own Postgres + VectorChord image. It has no `latest` or moving tag; upstream ties the
  # extension version to each Immich release, so this tag follows the release compose (README A-Q5).
  immichdb:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: kr-ccp-immichdb-0101
    restart: unless-stopped
    user: "2113:2113"                  # arbitrary uid: upstream postgres entrypoint uses nss_wrapper (to verify)
    read_only: true                    # to verify at build
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /etc/postgresql:size=8m,uid=2113,gid=2113   # entrypoint copies and edits postgresql.conf here
      - /var/run/postgresql:size=8m,uid=2113,gid=2113
      - /tmp:size=64m
    shm_size: 128mb
    pids_limit: 300
    mem_limit: 2g                      # docs: at least 2 GB when limits are set
    environment:
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_PASSWORD_FILE: /run/secrets/immich_db_password_pg
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: SSD
    secrets:
      - immich_db_password_pg
    volumes:
      - ${APPDATA}/immich/postgres:/var/lib/postgresql/data   # local pool only, never a network share
    networks:
      - immich-backend
    # healthcheck: built into the image (pg_isready + checksum failures)

  immichredis:
    image: valkey/valkey:latest        # upstream pins valkey:9 by digest; :latest per §8 (README A-Q5)
    container_name: kr-ccp-immichredis-0101
    restart: unless-stopped
    user: "2114:2114"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    pids_limit: 64
    mem_limit: 256m
    volumes:
      - ${APPDATA}/immich/redis:/data
      - ${APPDATA}/immich/secrets/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro   # requirepass <pw>
    networks:
      - immich-backend
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$(sed -n 's/^requirepass //p' /usr/local/etc/valkey/valkey.conf)\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ArchiveBox: archives web pages. Fetches anything it's given, so it sits on apps-vlan31: its UI (5797) is
  # then open on VLAN 31 (it has its own login; public index/snapshots/add view off).
  archivebox:
    image: ghcr.io/archivebox/archivebox:latest
    container_name: kr-ccp-archivebox-0101
    restart: unless-stopped
    user: "911:911"                    # the image's own uid: its dirs are owned 911, an arbitrary uid fails (exit 3)
    # Not read_only: the entrypoint needs /opt/archivebox writable, and it holds the browser and plugin
    # binaries, so a tmpfs won't do and a volume would keep stale binaries across image updates.
    cap_drop: [ALL]                    # Chromium runs with --no-sandbox (image sets CHROME_SANDBOX=false)
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=1g
    shm_size: 1gb                      # as upstream's compose
    pids_limit: 2048                   # as upstream's compose (Chromium)
    mem_limit: 2g
    environment:
      PUBLIC_INDEX: "False"            # the image defaults to True
      PUBLIC_SNAPSHOTS: "False"
      PUBLIC_ADD_VIEW: "False"
      TIMEOUT: "60"
    # Admin account: once, `docker compose run --rm archivebox archivebox manage createsuperuser`
    # (no *_FILE support; ADMIN_PASSWORD in env would be readable through the socket proxy).
    volumes:
      - ${APPDATA}/archivebox/data:/data   # owned 911
    networks:
      - apps-vlan31
    # healthcheck: built into the image (/health/ on 5797)

  # ArchiveTeam Warrior: downloads and runs ArchiveTeam's project code (git pull from GitHub, then exec'd
  # in-process) — a risky workload under CLAUDE.md §8 (README A-Q7). Its UI has no auth unless http_password
  # is set in projects/config.json (pre-made in the volume, 600; env vars would be readable via the proxy).
  archivewarrior:
    image: atdr.meo.ws/archiveteam/warrior-dockerfile:latest
    container_name: kr-ccp-archivewarrior-0101
    restart: unless-stopped
    user: "1000:1000"                  # the image's own uid (/home/warrior owned 1000)
    # Not read_only: /home/warrior/data holds the baked-in wget-at binaries and must be writable.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true         # also blocks the image's passwordless sudo
    tmpfs:
      - /tmp:size=256m
    pids_limit: 500
    mem_limit: 1g
    volumes:
      - ${APPDATA}/archivewarrior/projects:/home/warrior/projects   # config.json, project checkouts, item data
    networks:
      - apps-vlan31                    # egress: warriorhq, GitHub, trackers, upload targets, archived sites
    # healthcheck: built into the image (wget-at on 8001)

  # Atuin: shell history sync server. Clients reach it as svc:atuin. Registration closed after the first
  # account (ATUIN_OPEN_REGISTRATION=true once, then false).
  atuin:
    image: ghcr.io/atuinsh/atuin:latest   # upstream's latest lags releases (README A-Q8)
    container_name: kr-ccp-atuin-0101
    restart: unless-stopped
    user: "2121:2121"                  # no entrypoint script: any uid with a writable /config
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    pids_limit: 100
    mem_limit: 256m
    command: ["start"]
    environment:
      ATUIN_HOST: 0.0.0.0              # defaults to 127.0.0.1
      ATUIN_OPEN_REGISTRATION: "false"
      ATUIN_DB_URI: postgres://atuin@atuindb/atuin   # no password in the URI
      ATUIN_DB_PASSWORD_FILE: /run/secrets/atuin_db_password   # Atuin >= 18.24.0
    secrets:
      - atuin_db_password
    volumes:
      - ${APPDATA}/atuin/config:/config
    networks:
      - proxy-atuin                    # internal: atuin + sidecar
      - atuin-backend                  # internal: atuin + db
    depends_on:
      - atuindb
    # healthcheck: built into the image (/healthz)

  # Atuin's database, as in the template (Postgres). On :latest a new major version uses a new PGDATA
  # subfolder and starts an empty cluster next to the old one (README A-Q8: SQLite instead?).
  atuindb:
    image: postgres:latest
    container_name: kr-ccp-atuindb-0101
    restart: unless-stopped
    user: "2122:2122"                  # arbitrary uid: entrypoint uses nss_wrapper (needs /tmp)
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/run/postgresql:size=8m,uid=2122,gid=2122
      - /tmp:size=64m
    pids_limit: 200
    mem_limit: 512m
    environment:
      POSTGRES_USER: atuin
      POSTGRES_DB: atuin
      POSTGRES_PASSWORD_FILE: /run/secrets/atuin_db_password_pg
    secrets:
      - atuin_db_password_pg
    volumes:
      - ${APPDATA}/atuin/postgres:/var/lib/postgresql   # 18+: mount the parent, PGDATA is <major>/docker
    networks:
      - atuin-backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "atuin", "-d", "atuin"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Dillinger: Markdown editor. Upstream has no Dockerfile any more and no `latest`; 3.39.1 (2021) is the
  # newest amd64 image, and the MOS template was removed as broken (README A-Q9).
  dillinger:
    image: joemccann/dillinger:3.39.1
    container_name: kr-ccp-dillinger-0101
    restart: unless-stopped
    # runs as the image's own non-root user `dillinger` (uid unverified); no `user:` override
    read_only: true                    # unverified: the image chowns /public, so the app may write there
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    pids_limit: 100
    mem_limit: 256m
    networks:
      - proxy-dillinger                # internal: no egress (cloud plugins unused)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Filestash: file manager with storage backends. Until an admin password is set, /admin/setup is open:
  # set it right after the first start (only reachable through the sidecar).
  filestash:
    image: machines/filestash:latest
    container_name: kr-ccp-filestash-0101
    restart: unless-stopped
    # runs as the image's own user `filestash` (uid unverified, likely 1000): the binary is mode 730, so an
    # arbitrary uid can't execute it. No `user:` override.
    read_only: true                    # to verify at build
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /app/data/cache:size=512m
      - /tmp:size=256m
    pids_limit: 200
    mem_limit: 512m
    volumes:
      - ${APPDATA}/filestash/state:/app/data/state   # config.json (admin bcrypt hash), db, logs
    networks:
      - proxy-filestash                # internal: no egress (backends on other hosts would need it)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8334/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # RackPeek: homelab inventory. Its web UI has no authentication: Tailscale only (svc:rackpeek, admins).
  rackpeek:
    image: aptacode/rackpeek:latest
    container_name: kr-ccp-rackpeek-0101
    restart: unless-stopped
    user: "1654:1654"                  # the image's own uid; its dirs are owned 1654
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /app/tmp:size=64m,uid=1654,gid=1654   # TMPDIR
    pids_limit: 200
    mem_limit: 512m
    volumes:
      - ${APPDATA}/rackpeek/config:/app/config   # config.yaml, data-protection keys
    networks:
      - proxy-rackpeek                 # internal: no egress
    # healthcheck: built into the image (/health)

networks:
  apps-vlan31:
    name: apps-vlan31
    driver: macvlan
    driver_opts:
      parent: ${VLAN31_PARENT}
    ipam:
      config:
        - subnet: ${VLAN31_SUBNET}
          gateway: ${VLAN31_GATEWAY}
          ip_range: ${VLAN31_RANGE}
  proxy-paperless:
    name: proxy-paperless
    driver: bridge
    internal: true
  paperless-backend:
    name: paperless-backend
    driver: bridge
    internal: true
  proxy-filebrowser:
    name: proxy-filebrowser
    driver: bridge
    internal: true
  proxy-immich:
    name: proxy-immich
    driver: bridge
    internal: true
  immich-backend:
    name: immich-backend
    driver: bridge
    internal: true

  proxy-atuin:
    name: proxy-atuin
    driver: bridge
    internal: true
  atuin-backend:
    name: atuin-backend
    driver: bridge
    internal: true
  proxy-dillinger:
    name: proxy-dillinger
    driver: bridge
    internal: true
  proxy-filestash:
    name: proxy-filestash
    driver: bridge
    internal: true
  proxy-rackpeek:
    name: proxy-rackpeek
    driver: bridge
    internal: true
secrets:
  ts_authkey:
    file: ${APPDATA}/tailscale-apps/authkey          # 600, owned 2110; delete after the node has joined
  mediasort_token:
    file: ${APPDATA}/mediasort/secrets/token         # 600, owned 2104; same value in the mover's token file
  tmdb_token:
    file: ${APPDATA}/mediasort/secrets/tmdb          # 600, owned 2104
  llm_key:
    file: ${APPDATA}/mediasort/secrets/llm           # 600, owned 2104; the selected provider's API key
  paperless_secret_key:
    file: ${APPDATA}/paperless/secrets/secret_key    # openssl rand -hex 32, no trailing newline; 600, owned 2105
  paperless_redis_url:
    file: ${APPDATA}/paperless/secrets/redis_url     # redis://:<password>@paperlessredis:6379; 600, owned 2105
  immich_db_password:
    file: ${APPDATA}/immich/secrets/db_password      # letters and digits only (Immich docs); 600, owned 2111
  immich_db_password_pg:
    file: ${APPDATA}/immich/secrets/db_password_pg   # same value, second copy: 600, owned 2113 (the db's uid)
  immich_redis_password:
    file: ${APPDATA}/immich/secrets/redis_password   # same value as requirepass in valkey.conf; 600, owned 2111
  atuin_db_password:
    file: ${APPDATA}/atuin/secrets/db_password       # 600, owned 2121
  atuin_db_password_pg:
    file: ${APPDATA}/atuin/secrets/db_password_pg    # same value, second copy: 600, owned 2122
