services:
  gatus:
    image: twinproduction/gatus:latest
    container_name: kr-ccp-gatus-0101
    restart: always
    user: "65534:65534"              # host UID 165534 with userns-remap (base 100000)
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    pids_limit: 100
    mem_limit: 256m
    environment:
      GATUS_CONFIG_PATH: /config     # directory: Gatus merges every *.yaml in it
    ports:
      - "127.0.0.1:8081:8080"        # svc:gatus via tailscale serve
    networks:
      - proxy-gatus
    volumes:
      - ./gatus/config:/config:ro
      - ./gatus/data:/data
    # no healthcheck: scratch image; the Healthchecks.io heartbeat watches it

  beszel:
    image: henrygd/beszel:latest
    container_name: kr-ccp-beszel-0101
    restart: always
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m
    pids_limit: 200
    mem_limit: 512m
    environment:
      APP_URL: https://beszel.${TS_TAILNET_DOMAIN}
      USER_CREATION: "false"          # GitHub logins can't create new accounts, only match existing ones
      # DISABLE_PASSWORD_AUTH: "true" # enable only after GitHub login works
    ports:
      - "127.0.0.1:8090:8090"        # svc:beszel via tailscale serve
    networks:
      - proxy-beszel                 # egress: notifications + remote agents over the tailnet
      - beszel-local                 # reaches this host's own agent at 172.31.250.1:45876
    volumes:
      - ./beszel/hub-data:/beszel_data
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: kr-ccp-beszelagent-0101
    restart: always
    userns_mode: host                # required for host networking under userns-remap
    network_mode: host               # host netns = real eth0/tailscale0 traffic stats
    user: "65534:65534"              # real nobody on the host: not root, no caps
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 128m
    depends_on:
      socketproxy:
        condition: service_healthy
      beszel:
        condition: service_started   # creates beszel-local, whose gateway IP the agent binds to
    environment:
      LISTEN: "172.31.250.1:45876"   # host side of beszel-local only: not LAN, not tailnet
      KEY: ${BESZEL_HUB_PUBKEY}      # hub's PUBLIC key
      DOCKER_HOST: tcp://127.0.0.1:2375
    volumes:
      - ./beszel/agent-data:/var/lib/beszel-agent
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

  dozzle:
    image: amir20/dozzle:latest
    container_name: kr-ccp-dozzle-0101
    restart: always
    user: "65534:65534"              # host UID 165534 with userns-remap
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    depends_on:
      socketproxy:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://kr-ccp-socketproxy-0101:2375   # this host's own containers, read-only
      DOZZLE_HOSTNAME: ${DOZZLE_HOSTNAME}
      DOZZLE_AUTH_PROVIDER: simple   # users in ./dozzle/data/users.yml
      DOZZLE_AUTH_TTL: 48h
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_NO_ANALYTICS: "true"
      # Remote agents (later), reached over the tailnet:
      # DOZZLE_REMOTE_AGENT: 100.a.b.c:7007,100.d.e.f:7007
    ports:
      - "127.0.0.1:8082:8080"        # svc:dozzle via tailscale serve
    networks:
      - proxy-dozzle                 # egress to remote agents over the tailnet
      - socketproxy                  # this host's Docker API (read-only)
    volumes:
      - ./dozzle/data:/data
      - ./dozzle/certs/cert.pem:/dozzle_cert.pem:ro   # own mTLS pair, shared with agents
      - ./dozzle/certs/key.pem:/dozzle_key.pem:ro
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  socketproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: kr-ccp-socketproxy-0101
    restart: always
    userns_mode: host                # must be real root to open docker.sock under userns-remap
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 64m
    environment:
      - CONTAINERS=1   # list/inspect/stats
      - INFO=1
      - EVENTS=1
      - POST=0         # read-only API
    ports:
      - "127.0.0.1:2375:2375"        # for the host-network agent; localhost only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socketproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  proxy-gatus:
    name: proxy-gatus
    driver: bridge

  # Hub: egress to internet + tailnet via the host's tag:monitoring identity
  proxy-beszel:
    name: proxy-beszel
    driver: bridge

  # Hub -> local agent (agent listens on this bridge's gateway, 172.31.250.1)
  beszel-local:
    name: beszel-local
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.250.0/29
          gateway: 172.31.250.1

  # Socket proxy's own network, no egress; the agent reaches it via 127.0.0.1:2375
  socketproxy:
    name: socketproxy
    driver: bridge

 # Dozzle main UI: egress to remote agents over the tailnet
  proxy-dozzle:
    name: proxy-dozzle
    driver: bridge
