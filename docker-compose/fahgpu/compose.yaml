services:
  folding-at-home-gpu:
    image: yurinnick/folding-at-home:latest-nvidia
    container_name: sh-fahgpu-0101
    environment:
      - USER=Morna
      - TEAM=37451
      - PASSKEY=b8028855f0642f79b8028855f0642f79 #feel free to fold in my name, lawl.
      - ENABLE_GPU=true
      - ENABLE_SMP=false
