# compose-lint policy for this stack (.claude/rules/compose.md, "Lint gate"). Read from beside
# compose.yaml by CI and the Claude hook, with --strict-config. Suppressed findings stay visible as
# SUPPRESSED with the reason below. A new exception needs an entry here AND its record
# (CLAUDE.md §8, or the homenas README "Exception register").

rules:
  # Images stay on :latest, no tag or digest pinning (CLAUDE.md §8).
  CL-0004:
    enabled: false
    reason: "CLAUDE.md §8: images on :latest by decision"
  CL-0019:
    enabled: false
    reason: "CLAUDE.md §8: no digest pinning by decision"
  CL-0013:
    exclude_services:
      scrutinycollector: "homenas E5: /run/udev read-only for device metadata (Scrutiny README)"
  CL-0016:
    exclude_services:
      scrutinycollector: "homenas E5: NVMe controller devices only, never namespaces"
  CL-0024:
    exclude_services:
      scrutinycollector: "homenas E5: SYS_RAWIO + SYS_ADMIN for NVMe SMART (Scrutiny README)"
