# /etc/fluent-bit/fluent-bit.conf — journal (host + containers) -> LogTide
[SERVICE]
    Flush                     5
    Log_Level                 info
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.backlog.mem_limit 16M

[INPUT]
    Name              systemd
    Tag               journal
    DB                /var/lib/fluent-bit/journal.db
    # first start: don't replay the whole journal
    Read_From_Tail    On
    Strip_Underscores Off
    # buffer to disk if LogTide is down
    storage.type      filesystem

# Avoid feedback loops: LogTide logs its own ingest requests, Fluent Bit logs its own retries
[FILTER]
    Name    grep
    Match   journal
    Exclude CONTAINER_NAME ^kr-ccp-logtide
[FILTER]
    Name    grep
    Match   journal
    Exclude _SYSTEMD_UNIT ^fluent-bit\.service$

[FILTER]
    Name    lua
    Match   journal
    script  /etc/fluent-bit/logtide.lua
    call    to_logtide

[OUTPUT]
    Name             http
    Match            journal
    Host             ${LOGTIDE_HOST}
    Port             ${LOGTIDE_PORT}
    tls              ${LOGTIDE_TLS}
    tls.verify       On
    URI              /api/v1/ingest/single
    Format           json_lines
    json_date_key    time
    json_date_format iso8601
    Header           X-API-Key ${LOGTIDE_API_KEY}
    Retry_Limit      False
