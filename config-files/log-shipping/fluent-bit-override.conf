# /etc/systemd/system/fluent-bit.service.d/override.conf — run unprivileged and sandboxed
[Service]
User=fluentbit
Group=fluentbit
SupplementaryGroups=systemd-journal
EnvironmentFile=/etc/fluent-bit/logtide.env
StateDirectory=fluent-bit
StateDirectoryMode=0700
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
MemoryMax=256M
