# /etc/systemd/journald.conf.d/50-logging.conf
# Persistent journal (Raspberry Pi OS may otherwise keep it in RAM only),
# capped on disk, rate limits relaxed for chatty containers, Forward Secure Sealing on.
# Note: journald does not allow comments on the same line as a setting.
[Journal]
Storage=persistent
SystemMaxUse=2G
SystemKeepFree=10G
MaxRetentionSec=30day
RateLimitIntervalSec=30s
RateLimitBurst=20000
Seal=yes
